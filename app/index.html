<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google tag (gtag.js) - GA4 property G-SBV4Y6KY5R, carried over
         from the previous ashkanstudios.com site (recovered via Web
         Archive) so the client's existing Analytics history continues.
         GA4 Enhanced Measurement (on by default) also tracks SPA route
         changes via the History API, which this site uses. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SBV4Y6KY5R"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-SBV4Y6KY5R');
    </script>
    <meta name="description" content="Ashkan Studios - Full-service production company specializing in commercial photography, videography, and creative direction. Based in Houston, TX." />
    <meta name="keywords" content="photography, videography, production, commercial, Houston, Ashkan Studios, Ashkan Image, Ashkan Media" />
    <meta name="author" content="Ashkan Studios" />
    <meta property="og:title" content="Ashkan Studios | Full-Service Production Company" />
    <meta property="og:description" content="We craft unforgettable visuals through commercial photography, videography, and creative direction." />
    <meta property="og:type" content="website" />
    <!-- Static OG/Twitter tags: social scrapers (WhatsApp/Facebook/
         LinkedIn/X) do NOT execute JS, so the share image + URL must
         live in the static HTML. Absolute URLs are required by the
         Open Graph spec. -->
    <meta property="og:url" content="https://ashkanstudios.com/" />
    <meta property="og:site_name" content="Ashkan Studios" />
    <meta property="og:image" content="https://ashkanstudios.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ashkan Studios | Full-Service Production Company" />
    <meta name="twitter:description" content="We craft unforgettable visuals through commercial photography, videography, and creative direction." />
    <meta name="twitter:image" content="https://ashkanstudios.com/og-image.jpg" />
    <!-- LocalBusiness structured data - address/phone/email match the
         site footer and contact page. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Ashkan Studios",
      "description": "Full-service production company specializing in commercial photography, videography, and creative direction.",
      "url": "https://ashkanstudios.com/",
      "logo": "https://ashkanstudios.com/images/logo.png",
      "image": "https://ashkanstudios.com/og-image.jpg",
      "telephone": "+1-346-335-7973",
      "email": "info@ashkanstudios.com",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "1502 Sawyer St #108",
        "addressLocality": "Houston",
        "addressRegion": "TX",
        "postalCode": "77007",
        "addressCountry": "US"
      },
      "areaServed": "Houston, TX",
      "sameAs": [
        "https://instagram.com/ashkanstudios",
        "https://linkedin.com/company/ashkan-studios"
      ]
    }
    </script>
    <!-- Favicon = the metallic "AS" monogram badge (supplied 7/3) -
         square mark, so the initials stay readable even at 16-32px
         tab size. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Ashkan Studios | Full-Service Production Company</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
